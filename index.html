  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http: https: ws: wss:; img-src 'self' http: https: data: blob: *.openstreetmap.org ui-avatars.com images.unsplash.com picsum.photos;">
    <title>SCMD Pro v5.0.0</title>
    <!-- Version: 5.0.0-Enterprise -->
    <script>
      // SCMD PRO FIX: Anti-Sandbox Fetch Collision
      // Ngăn lỗi "Cannot set property fetch of #<Window> which has only a getter"
      // xảy ra khi các thư viện (như OpenTelemetry) cố gắng patch window.fetch trong môi trường sandbox.
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return currentFetch; },
            set: function(newFetch) { currentFetch = newFetch; }
          });
        } catch (e) {
          // Fail-silent setup for sandbox
        }
      })();

      // SCMD PRO FIX: Tắt hoàn toàn rác console từ Vite HMR WebSocket
      const OriginalWebSocket = window.WebSocket;
      window.WebSocket = function(url, protocols) {
        if (typeof url === 'string' && (url.includes(':24678') || url.includes('__vite_hmr'))) {
          // Trả về một dummy object trông giống WebSocket nhưng không làm gì cả
          const dummyWS = {
            addEventListener: function() {},
            removeEventListener: function() {},
            send: function() {},
            close: function() { this.readyState = 3; },
            readyState: 0,
            OPEN: 1,
            CONNECTING: 0,
            CLOSING: 2,
            CLOSED: 3
          };
          setTimeout(() => {
            dummyWS.readyState = 3; // CLOSED
            if (typeof dummyWS.onclose === 'function') {
              dummyWS.onclose({ code: 1000, reason: 'HMR disabled', wasClean: true });
            }
          }, 100);
          return dummyWS;
        }
        return new OriginalWebSocket(url, protocols);
      };
      // Gán lại các property prototype
      window.WebSocket.prototype = OriginalWebSocket.prototype;
      window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
      window.WebSocket.OPEN = OriginalWebSocket.OPEN;
      window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
      window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
