# =============================================================
# SCMD Pro — Nginx Reverse Proxy Config
# FIX: proxy_pass trỏ đến service 'app' (tên trong docker-compose)
#      nginx.conf cũ trỏ đến 'api' — service không tồn tại → 502 Bad Gateway
# =============================================================

# HTTP redirect to HTTPS
# Dynamic Upstream for API Scaling
upstream api_servers {
    least_conn;
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # [FIX C-03] Path khớp với volume mount ./infra/certs/ssl:/etc/nginx/ssl
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Content-Security-Policy duoc quan ly tap trung boi Express/Helmet de tranh split-brain
    # giua reverse proxy va application shell.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # API Reverse Proxy → Node.js app
    location /api/ {
        proxy_pass http://api_servers/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho request nặng (xuất PDF)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Socket.io WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://api_servers/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static Frontend Assets (cache dài hạn)
    location /assets/ {
        proxy_pass http://api_servers/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA Service Worker (không cache)
    location ~* \.(webmanifest|sw\.js|workbox-.+\.js)$ {
        proxy_pass http://api_servers;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA Catch-all → Node.js serves index.html
    location / {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"error":"Service temporarily unavailable","status":503}';
        add_header Content-Type application/json;
    }
}