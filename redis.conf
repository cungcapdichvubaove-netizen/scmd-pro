# SCMD Pro — Redis Configuration
# Do not store Redis credentials in this file.
# Production compose injects --requirepass from REDIS_PASSWORD.

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# TLS Setup for M-04
tls-port 6379
port 0
tls-cert-file /etc/ssl/redis/redis.crt
tls-key-file /etc/ssl/redis/redis.key
tls-ca-cert-file /etc/ssl/redis/ca.crt
tls-auth-clients no

# Persistence
appendonly yes
appendfsync everysec

# Security: chỉ listen trên loopback trong container
# bind 127.0.0.1 (không cần vì Docker network isolate)

# Performance
tcp-keepalive 300
timeout 0
